name: Threat Hunt
description: >
  Proactive threat hunting playbook - hypothesis-based hidden threat search.
  MITRE ATT&CK framework mapping, automated IOC enrichment with MCP tools,
  network analysis, forensic investigation, and detection rule generation.
trigger_type: manual
input_params:
  - name: hunt_hypothesis
    description: Threat hunting hypothesis
    required: true
  - name: hunt_timerange
    description: Search time range (e.g., 7d, 30d)
    required: false
  - name: known_indicators
    description: Known IOCs (IP, domain, hash)
    required: false
  - name: target_systems
    description: Target systems
    required: false

steps:
  # ===== Phase 1: Hypothesis and Intelligence =====
  - name: recall_previous_iocs
    tool: recall_ioc
    params:
      hypothesis: "{{hunt_hypothesis}}"
      known_indicators: "{{known_indicators}}"
    description: Recall cached IOCs from previous analyses - prevent redundant querying

  - name: define_hypothesis
    action: input
    params:
      prompt: "{{hunt_hypothesis}}"
    description: >
      Define the threat hunting hypothesis and identify expected adversary TTPs.
      Example: "APT group X is targeting via supply chain attack"

  - name: map_to_mitre
    tool: extract_iocs
    params:
      text: "{{hunt_hypothesis}}"
    description: Map the hypothesis to MITRE ATT&CK techniques, identify relevant data sources

  - name: search_all_threat_intel
    tool: search_threat_intel
    params:
      hypothesis: "{{hunt_hypothesis}}"
      indicators: "{{known_indicators}}"
    description: Search threat intelligence across 20+ sources - comprehensive IOC and TTP enrichment

  - name: gather_threat_intel
    tool: mcp:threat-intel-free/threatfox_recent_iocs
    params: {}
    description: Gather recent ThreatFox IOCs - threats related to the hypothesis

  - name: gather_recent_malware
    tool: mcp:threat-intel-free/recent_malware_samples
    params: {}
    description: Gather recent malware samples - validate hypothesis with current threat samples

  - name: check_known_hashes
    tool: mcp:threat-intel-free/malwarebazaar_hash_lookup
    for_each: "known_indicators.hashes"
    params:
      hash_value: "{{item}}"
    condition:
      if: "{{known_indicators.hashes}}"
    description: Check known hashes on MalwareBazaar

  - name: check_known_ips
    tool: mcp:threat-intel-free/blocklist_check
    for_each: "known_indicators.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{known_indicators.ips}}"
    description: Check known IPs on blocklists

  - name: check_known_domains
    tool: mcp:osint-tools/whois_lookup
    for_each: "known_indicators.domains"
    params:
      target: "{{item}}"
    condition:
      if: "{{known_indicators.domains}}"
    description: WHOIS information for known domains

  - name: domain_ssl_check
    tool: mcp:osint-tools/ssl_certificate_info
    for_each: "known_indicators.domains"
    params:
      host: "{{item}}"
    condition:
      if: "{{known_indicators.domains}}"
    description: Domain SSL certificate check - fake certificate detection

  - name: ip_geoip
    tool: mcp:osint-tools/geoip_lookup
    for_each: "known_indicators.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{known_indicators.ips}}"
    description: IP geolocation information

  - name: feodo_check
    tool: mcp:threat-intel-free/feodo_tracker_check
    for_each: "known_indicators.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{known_indicators.ips}}"
    description: Feodo Tracker C2 botnet check

  - name: malwoverview_enrichment
    tool: mcp:malwoverview/malwoverview_hash_lookup
    for_each: "known_indicators.hashes"
    params:
      hash_value: "{{item}}"
    condition:
      if: "{{known_indicators.hashes}}"
    description: Hash intelligence enrichment via Malwoverview

  # ===== Phase 1b: Free OSINT Enrichment =====
  - name: shodan_ip_recon
    tool: mcp:free-osint/shodan_internetdb_lookup
    for_each: "known_indicators.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{known_indicators.ips}}"
    description: IP open port, CVE, and service check via Shodan InternetDB (FREE)

  - name: malpedia_search
    tool: mcp:free-osint/malpedia_malware_search
    params:
      query: "{{hunt_hypothesis}}"
    description: Malpedia malware family search - search for the malware family in the hypothesis on Malpedia

  - name: ransomwatch_activity
    tool: mcp:free-osint/ransomwatch_check
    params:
      query: "{{hunt_hypothesis}}"
    description: Ransomware group activity and victim check via Ransomwatch

  - name: darksearch_intel
    tool: mcp:free-osint/darksearch_query
    params:
      query: "{{hunt_hypothesis}}"
    description: Dark web search (Ahmia.fi) - threat actor activity and data leak detection

  - name: epss_top_threats
    tool: mcp:free-osint/epss_top_exploited
    params:
      top_n: 20
    description: EPSS top exploited CVEs - hypothesis validation against current exploit trends

  - name: paste_leak_search
    tool: mcp:free-osint/paste_site_search
    params:
      query: "{{hunt_hypothesis}}"
    description: Paste site search - credential leak and data breach detection

  # ===== Phase 2: Generating Hunt Queries =====
  - name: build_hunt_queries
    tool: generate_rules
    params:
      analysis_result:
        hypothesis: "{{hunt_hypothesis}}"
        mitre_techniques: "{{map_to_mitre.techniques}}"
        intel: "{{gather_threat_intel}}"
        known_iocs: "{{known_indicators}}"
      rule_types:
        - sigma
        - kql
        - spl
        - yara
    description: Generate hunting queries for SIEM and EDR platforms

  # ===== Phase 3: Executing the Hunt =====
  - name: execute_hunt
    tool: search_logs
    params:
      query: "{{build_hunt_queries.queries}}"
      timerange: "{{hunt_timerange}}"
    description: Execute hunting queries across existing log sources

  - name: network_ioc_analysis
    tool: mcp:network-analysis/analyze_network_iocs
    params:
      iocs: "{{known_indicators}}"
    condition:
      if: "{{known_indicators}}"
    description: Analyze network IOCs - DNS, connection, traffic

  - name: zeek_log_analysis
    tool: mcp:network-analysis/analyze_zeek_logs
    params:
      timerange: "{{hunt_timerange}}"
      indicators: "{{known_indicators}}"
    description: Zeek log analysis - search for suspicious activity in network connection logs

  - name: suricata_alert_analysis
    tool: mcp:network-analysis/analyze_suricata_alerts
    params:
      timerange: "{{hunt_timerange}}"
      indicators: "{{known_indicators}}"
    description: Suricata alert analysis - threat matching against IDS/IPS alerts

  - name: suspicious_port_scan
    tool: mcp:network-analysis/port_check
    for_each: "known_indicators.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{known_indicators.ips}}"
    description: Port scan on suspicious IPs - open service and backdoor detection

  - name: dns_lookup_indicators
    tool: mcp:network-analysis/dns_lookup
    for_each: "known_indicators.domains"
    params:
      domain: "{{item}}"
    condition:
      if: "{{known_indicators.domains}}"
    description: DNS lookup - domain resolution and suspicious DNS record analysis

  # ===== Phase 4: Findings Analysis =====
  - name: analyze_results
    condition:
      if: "{{execute_hunt.results_count}} > 0"
      then: triage_findings
      else: document_negative

  - name: triage_findings
    tool: mcp:threat-intel-free/threatfox_ioc_lookup
    for_each: "execute_hunt.suspicious_indicators"
    params:
      indicator: "{{item}}"
    description: Enrich suspicious items on ThreatFox

  - name: cross_correlate_findings
    tool: correlate_findings
    params:
      hunt_results: "{{execute_hunt}}"
      triage_results: "{{triage_findings}}"
      network_analysis: "{{network_ioc_analysis}}"
      zeek_results: "{{zeek_log_analysis}}"
      suricata_results: "{{suricata_alert_analysis}}"
      threat_intel: "{{gather_threat_intel}}"
    description: Cross-correlate all finding sources - false positive reduction and threat validation

  - name: suspicious_file_forensics
    tool: mcp:forensics-tools/file_metadata
    for_each: "execute_hunt.suspicious_files"
    params:
      file_path: "{{item}}"
    condition:
      if: "{{execute_hunt.suspicious_files}}"
    description: Forensic analysis of suspicious files

  - name: pe_analysis
    tool: mcp:remnux/pe_analyze
    for_each: "execute_hunt.suspicious_executables"
    params:
      file_path: "{{item}}"
    condition:
      if: "{{execute_hunt.suspicious_executables}}"
    description: Structural analysis of suspicious PE files

  - name: capa_analysis
    tool: mcp:flare/capa_analyze
    for_each: "execute_hunt.suspicious_executables"
    params:
      file_path: "{{item}}"
    condition:
      if: "{{execute_hunt.suspicious_executables}}"
    description: Capability analysis via CAPA - malware behaviors

  - name: yara_scan
    tool: mcp:remnux/yara_scan
    params:
      target_path: "{{target_systems.suspicious_dirs}}"
    condition:
      if: "{{target_systems.suspicious_dirs}}"
    description: YARA scan on target directories

  # ===== Phase 5: Decision =====
  - name: evaluate_findings
    condition:
      if: "{{triage_findings.confirmed_threats}} > 0"
      then: escalate_to_ir
      else: refine_hypothesis

  - name: escalate_to_ir
    action: trigger_playbook
    params:
      playbook: incident_response
      incident_description: "{{triage_findings}}"
    description: >
      Route to incident response workflow for confirmed threats.
      Hunt findings are transferred to the IR team.

  - name: refine_hypothesis
    action: final_answer
    description: >
      Document hunt results, refine hypothesis, and plan follow-up hunts.
      Even if no findings are discovered, negative results are valuable.

  - name: document_negative
    action: final_answer
    description: >
      Document negative findings - no threat detected.
      Update hunt backlog, perform hypothesis revision.