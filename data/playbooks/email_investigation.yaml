name: Email Investigation
description: >
  In-depth email investigation - header analysis, sender verification,
  URL and attachment analysis, threat intelligence check, verdict determination.
  More comprehensive than the phishing playbook - for all email threats.
trigger_type: manual
input_params:
  - name: eml_path
    description: Path to email file (.eml/.msg)
    required: true
  - name: reported_by
    description: Person who reported the email
    required: false
  - name: investigation_type
    description: >
      Investigation type: phishing, bec, spam, malware_delivery, spear_phishing
    required: false

steps:
  # ===== Phase 1: Email Parsing =====
  - name: parse_email
    tool: analyze_email
    params:
      file_path: "{{eml_path}}"
    description: Email header, body, and attachment analysis

  - name: extract_email_iocs
    tool: extract_iocs
    params:
      text: "{{parse_email.body}}"
    description: Extract all IOCs from email body (URL, IP, domain, hash, email)

  # ===== Phase 2: Sender Verification =====
  - name: sender_whois
    tool: mcp:osint_tools/whois_lookup
    params:
      target: "{{parse_email.sender_domain}}"
    description: Sender domain WHOIS - registration date, ownership (new domain = suspicious)

  - name: sender_email_security
    tool: mcp:osint_tools/email_security_check
    params:
      domain: "{{parse_email.sender_domain}}"
    description: SPF, DKIM, DMARC check - email spoofing detection

  - name: sender_dns
    tool: mcp:osint_tools/dns_resolve
    params:
      domain: "{{parse_email.sender_domain}}"
    description: Sender domain DNS records - MX, A, TXT

  - name: sender_ssl
    tool: mcp:osint_tools/ssl_certificate_info
    params:
      host: "{{parse_email.sender_domain}}"
    description: Sender domain SSL certificate information

  - name: sender_subdomains
    tool: mcp:osint_tools/subdomain_enumerate
    params:
      domain: "{{parse_email.sender_domain}}"
    description: Sender domain subdomain enumeration - related domains

  - name: sender_ip_check
    tool: mcp:threat_intel_tools/blocklist_check
    params:
      ip: "{{parse_email.sender_ip}}"
    condition:
      if: "{{parse_email.sender_ip}}"
    description: Sender IP blocklist check

  - name: sender_ip_geo
    tool: mcp:osint_tools/geoip_lookup
    params:
      ip: "{{parse_email.sender_ip}}"
    condition:
      if: "{{parse_email.sender_ip}}"
    description: Sender IP GeoIP information

  - name: sender_feodo
    tool: mcp:threat_intel_tools/feodo_tracker_check
    params:
      ip: "{{parse_email.sender_ip}}"
    condition:
      if: "{{parse_email.sender_ip}}"
    description: Sender IP Feodo Tracker C2 check

  - name: sender_tor
    tool: mcp:threat_intel_tools/tor_exit_node_check
    params:
      ip: "{{parse_email.sender_ip}}"
    condition:
      if: "{{parse_email.sender_ip}}"
    description: Sender IP Tor exit node check

  # ===== Phase 2b: Free OSINT Enrichment =====
  - name: sender_hudsonrock
    tool: mcp:free_osint_tools/hudsonrock_check
    params:
      domain: "{{parse_email.sender_domain}}"
    description: HudsonRock info-stealer victim check - have sender domain employees been compromised?

  - name: sender_typosquat
    tool: mcp:free_osint_tools/typosquat_detect
    params:
      domain: "{{parse_email.sender_domain}}"
    description: Typosquat detection - is the sender domain a fake copy of a legitimate domain?

  # ===== Phase 3: URL Analysis =====
  - name: url_openphish
    tool: mcp:free_osint_tools/openphish_lookup
    for_each: "extract_email_iocs.urls"
    params:
      url: "{{item}}"
    description: OpenPhish phishing URL feed check

  - name: url_urlhaus
    tool: mcp:threat_intel_tools/urlhaus_lookup
    for_each: "extract_email_iocs.urls"
    params:
      indicator: "{{item}}"
    description: Check URLs in URLhaus

  - name: url_malwoverview
    tool: mcp:malwoverview_tools/malwoverview_url_check
    for_each: "extract_email_iocs.urls"
    params:
      url: "{{item}}"
    description: URL threat check with Malwoverview

  - name: url_headers
    tool: mcp:osint_tools/http_headers
    for_each: "extract_email_iocs.urls"
    params:
      url: "{{item}}"
    description: URL HTTP header analysis - redirect, server information

  - name: url_domain_ssl
    tool: mcp:osint_tools/ssl_certificate_info
    for_each: "extract_email_iocs.domains"
    params:
      host: "{{item}}"
    description: URL domain SSL certificate check

  - name: url_domain_whois
    tool: mcp:osint_tools/whois_lookup
    for_each: "extract_email_iocs.domains"
    params:
      target: "{{item}}"
    description: URL domain WHOIS - newly registered domain check

  - name: url_domain_dns
    tool: mcp:osint_tools/dns_resolve
    for_each: "extract_email_iocs.domains"
    params:
      domain: "{{item}}"
    description: URL domain DNS resolution

  # ===== Phase 4: IP Analysis =====
  - name: ip_reputation
    tool: mcp:threat_intel_tools/blocklist_check
    for_each: "extract_email_iocs.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{extract_email_iocs.ips}}"
    description: Blocklist check for IPs in the body

  - name: ip_threatfox
    tool: mcp:threat_intel_tools/threatfox_ioc_lookup
    for_each: "extract_email_iocs.ips"
    params:
      indicator: "{{item}}"
    condition:
      if: "{{extract_email_iocs.ips}}"
    description: ThreatFox check for IPs in the body

  - name: ip_geoip
    tool: mcp:osint_tools/geoip_lookup
    for_each: "extract_email_iocs.ips"
    params:
      ip: "{{item}}"
    condition:
      if: "{{extract_email_iocs.ips}}"
    description: GeoIP information for IPs in the body

  # ===== Phase 5: Attachment Analysis =====
  - name: attachment_metadata
    tool: mcp:forensics_tools/file_metadata
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    description: Attachment metadata and hash analysis

  - name: attachment_hash_check
    tool: mcp:threat_intel_tools/malwarebazaar_hash_lookup
    for_each: "parse_email.attachments"
    params:
      hash_value: "{{item.sha256}}"
    description: Check attachment hashes in MalwareBazaar

  - name: attachment_malwoverview
    tool: mcp:malwoverview_tools/malwoverview_triage
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    description: Attachment triage with Malwoverview

  - name: attachment_macro_check
    tool: mcp:remnux_tools/olevba_analyze
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    condition:
      if: "{{item.type}} in ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'docm', 'xlsm', 'pptm']"
    description: Macro/VBA analysis in Office documents

  - name: attachment_ole_objects
    tool: mcp:remnux_tools/oleobj_extract
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    condition:
      if: "{{item.type}} in ['doc', 'docx', 'xls', 'xlsx', 'rtf', 'docm', 'xlsm']"
    description: OLE object extraction - embedded files

  - name: attachment_pe_check
    tool: mcp:remnux_tools/pe_analyze
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    condition:
      if: "{{item.type}} in ['exe', 'dll', 'scr', 'com', 'pif']"
    description: PE file structural analysis

  - name: attachment_entropy
    tool: mcp:remnux_tools/file_entropy
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    description: Attachment entropy analysis - packing/encryption detection

  - name: attachment_strings
    tool: mcp:forensics_tools/string_analysis
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    description: String analysis in attachment files - suspicious string detection

  # ===== Phase 6: Comprehensive Threat Intel =====
  - name: threatfox_all
    tool: mcp:threat_intel_tools/threatfox_ioc_lookup
    for_each: "extract_email_iocs.all_iocs"
    params:
      indicator: "{{item}}"
    description: Check all IOCs in ThreatFox

  # ===== Phase 7: Verdict =====
  - name: evaluate_email_threat
    condition:
      if: >
        {{sender_email_security.score}} < '2/3' or
        {{url_urlhaus.malicious}} or
        {{attachment_hash_check.malicious}} or
        {{attachment_macro_check.suspicious}} or
        {{sender_ip_check.blocklisted}} or
        {{sender_feodo.found}}
      then: confirm_malicious_email
      else: document_clean_email

  - name: confirm_malicious_email
    tool: generate_rules
    params:
      analysis_result: "{{parse_email}}"
      iocs: "{{extract_email_iocs}}"
      threat_intel: "{{threatfox_all}}"
    description: >
      MALICIOUS EMAIL CONFIRMED - generate block rules:
      - Block sender domain/IP
      - Block URL
      - Block hash
      - YARA rule
      - Email filter rule

  - name: document_clean_email
    action: final_answer
    description: >
      Email investigation report:
      - Sender verification results (WHOIS, SPF/DKIM/DMARC, DNS, SSL)
      - URL analysis results (URLhaus, HTTP headers, SSL)
      - Attachment analysis results (hash, macro, entropy, strings)
      - IP reputation information
      - Threat intel results (ThreatFox, MalwareBazaar, Feodo)
      - Verdict: Clean / Suspicious / Malicious
      - Recommended actions