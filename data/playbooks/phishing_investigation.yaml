name: Phishing Investigation
description: >
  Email phishing investigation - header analysis, URL check,
  attachment analysis, sender verification, verdict determination.
trigger_type: manual
input_params:
  - name: email_path
    description: Path to the email file (.eml/.msg)
    required: true
  - name: reported_by
    description: Who reported the phishing email
    required: false

steps:
  # ===== Email Analysis =====
  - name: parse_email
    tool: analyze_email
    params:
      file_path: "{{email_path}}"
    description: Email header, body, and attachment analysis

  - name: extract_iocs
    tool: extract_iocs
    params:
      text: "{{parse_email.body}}"
    description: Extract IOCs (URL, IP, domain, hash) from the email body

  # ===== Sender Verification =====
  - name: sender_domain_check
    tool: mcp:osint_tools/whois_lookup
    params:
      target: "{{parse_email.sender_domain}}"
    description: Sender domain WHOIS information - when was it registered?

  - name: sender_email_security
    tool: mcp:osint_tools/email_security_check
    params:
      domain: "{{parse_email.sender_domain}}"
    description: SPF, DKIM, DMARC check - email spoofing detection

  - name: sender_dns
    tool: mcp:osint_tools/dns_resolve
    params:
      domain: "{{parse_email.sender_domain}}"
    description: Sender domain DNS records

  # ===== Free OSINT Enrichment =====
  - name: sender_typosquat
    tool: mcp:free_osint_tools/typosquat_detect
    params:
      domain: "{{parse_email.sender_domain}}"
    description: Typosquat detection - is the sender domain a fake copy of a legitimate domain?

  - name: sender_hudsonrock
    tool: mcp:free_osint_tools/hudsonrock_check
    params:
      domain: "{{parse_email.sender_domain}}"
    description: HudsonRock info-stealer victim check - have employees of the sender domain been compromised?

  - name: paste_leak_check
    tool: mcp:free_osint_tools/paste_site_search
    params:
      query: "{{parse_email.sender_domain}}"
    description: Paste site search - credential leak check associated with the sender domain

  # ===== URL Analysis =====
  - name: url_openphish
    tool: mcp:free_osint_tools/openphish_lookup
    for_each: "extract_iocs.urls"
    params:
      url: "{{item}}"
    description: OpenPhish phishing URL feed check

  - name: url_check
    tool: mcp:threat_intel_tools/urlhaus_lookup
    for_each: "extract_iocs.urls"
    params:
      indicator: "{{item}}"
    description: Check URLs on URLhaus

  - name: url_headers
    tool: mcp:osint_tools/http_headers
    for_each: "extract_iocs.urls"
    params:
      url: "{{item}}"
    description: Check HTTP headers of the URLs

  - name: url_ssl
    tool: mcp:osint_tools/ssl_certificate_info
    for_each: "extract_iocs.domains"
    params:
      host: "{{item}}"
    description: SSL certificate check for URL domains

  # ===== Attachment Analysis =====
  - name: attachment_triage
    tool: mcp:forensics_tools/file_metadata
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    description: Attachment metadata and hash analysis

  - name: attachment_hash_check
    tool: mcp:threat_intel_tools/malwarebazaar_hash_lookup
    for_each: "parse_email.attachments"
    params:
      hash_value: "{{item.sha256}}"
    description: Check attachment hashes on MalwareBazaar

  - name: attachment_macro_check
    tool: mcp:remnux_tools/olevba_analyze
    for_each: "parse_email.attachments"
    params:
      file_path: "{{item.path}}"
    condition:
      if: "{{item.type}} in ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'docm', 'xlsm']"
    description: Macro check in Office attachments

  # ===== IP Reputation =====
  - name: sender_ip_check
    tool: mcp:threat_intel_tools/blocklist_check
    params:
      ip: "{{parse_email.sender_ip}}"
    condition:
      if: "{{parse_email.sender_ip}}"
    description: Sender IP blocklist check

  - name: sender_ip_geo
    tool: mcp:osint_tools/geoip_lookup
    params:
      ip: "{{parse_email.sender_ip}}"
    condition:
      if: "{{parse_email.sender_ip}}"
    description: Sender IP GeoIP information

  # ===== Threat Intel =====
  - name: threatfox_check
    tool: mcp:threat_intel_tools/threatfox_ioc_lookup
    for_each: "extract_iocs.all_iocs"
    params:
      indicator: "{{item}}"
    description: Check all IOCs on ThreatFox

  # ===== Verdict =====
  - name: evaluate_phishing
    condition:
      if: "{{sender_email_security.score}} < '2/3' or {{url_check.malicious}} or {{attachment_hash_check.malicious}}"
      then: confirm_phishing
      else: document_benign

  - name: confirm_phishing
    tool: generate_rules
    params:
      analysis_result: "{{parse_email}}"
      iocs: "{{extract_iocs}}"
    description: Phishing confirmed - generate blocking rules

  - name: document_benign
    action: final_answer
    description: >
      Phishing analysis report: sender verification, URL analysis,
      attachment check, IOC list, verdict, and actions