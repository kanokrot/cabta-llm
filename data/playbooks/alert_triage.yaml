name: Alert Triage
category: Incident Response
description: >
  Security alert triage playbook - fast classification of incoming alerts,
  IOC extraction, threat intelligence enrichment, prioritization, and action determination.
  Automated multi-source threat intel check with MCP tools.
auto_enrich_context: true
trigger_type: manual
input_params:
  - name: alert_text
    description: Alert text (SIEM alert, EDR alert, email notification)
    required: true
  - name: alert_source
    description: Alert source (SIEM, EDR, IDS, email)
    required: false
  - name: alert_severity
    description: Source system severity level
    required: false

steps:
  # ===== Phase 1: IOC Extraction =====
  - name: extract_alert_iocs
    tool: extract_iocs
    params:
      text: "{{alert_text}}"
    description: Extract all IOCs from the alert text (IP, domain, hash, URL, email, CVE)

  # ===== Phase 2: Threat Intel Enrichment =====
  - name: hash_malwarebazaar
    tool: mcp:threat_intel_tools/malwarebazaar_hash_lookup
    for_each: "extract_alert_iocs.hashes"
    params:
      hash_value: "{{item}}"
    description: Check hashes in MalwareBazaar

  - name: hash_malwoverview
    tool: mcp:malwoverview_tools/malwoverview_hash_lookup
    for_each: "extract_alert_iocs.hashes"
    params:
      hash_value: "{{item}}"
    description: Comprehensive hash intelligence with Malwoverview

  - name: url_urlhaus
    tool: mcp:threat_intel_tools/urlhaus_lookup
    for_each: "extract_alert_iocs.urls"
    params:
      indicator: "{{item}}"
    description: Check URLs in URLhaus

  - name: ip_blocklist
    tool: mcp:threat_intel_tools/blocklist_check
    for_each: "extract_alert_iocs.ips"
    params:
      ip: "{{item}}"
    description: Check IPs in blocklists

  - name: ip_feodo
    tool: mcp:threat_intel_tools/feodo_tracker_check
    for_each: "extract_alert_iocs.ips"
    params:
      ip: "{{item}}"
    description: Check IPs in the Feodo Tracker C2 list

  - name: ip_tor
    tool: mcp:threat_intel_tools/tor_exit_node_check
    for_each: "extract_alert_iocs.ips"
    params:
      ip: "{{item}}"
    description: Tor exit node check

  - name: threatfox_all
    tool: mcp:threat_intel_tools/threatfox_ioc_lookup
    for_each: "extract_alert_iocs.all_iocs"
    params:
      indicator: "{{item}}"
    description: Check all IOCs in ThreatFox

  # ===== Phase 2b: Free OSINT Enrichment =====
  - name: ip_shodan_internetdb
    tool: mcp:free_osint_tools/shodan_internetdb_lookup
    for_each: "extract_alert_iocs.ips"
    params:
      ip: "{{item}}"
    description: Check open ports, CVEs, and services for IPs via Shodan InternetDB (FREE, no API key required)

  - name: url_openphish
    tool: mcp:free_osint_tools/openphish_lookup
    for_each: "extract_alert_iocs.urls"
    params:
      url: "{{item}}"
    description: OpenPhish phishing URL feed check

  - name: ransomware_check
    tool: mcp:free_osint_tools/ransomwatch_check
    params:
      query: "{{alert_text}}"
    description: Check ransomware group activity and victims via Ransomwatch

  # ===== Phase 3: OSINT Enrichment =====
  - name: ip_geoip
    tool: mcp:osint_tools/geoip_lookup
    for_each: "extract_alert_iocs.ips"
    params:
      ip: "{{item}}"
    description: IP GeoIP information - country/city/ISP

  - name: domain_whois
    tool: mcp:osint_tools/whois_lookup
    for_each: "extract_alert_iocs.domains"
    params:
      target: "{{item}}"
    description: Domain WHOIS information

  - name: domain_dns
    tool: mcp:osint_tools/dns_resolve
    for_each: "extract_alert_iocs.domains"
    params:
      domain: "{{item}}"
    description: Domain DNS resolution

  - name: email_security
    tool: mcp:osint_tools/email_security_check
    for_each: "extract_alert_iocs.sender_domains"
    params:
      domain: "{{item}}"
    condition:
      if: "{{extract_alert_iocs.sender_domains}}"
    description: Email security check (SPF, DKIM, DMARC)

  # ===== Phase 4: Vulnerability Check =====
  - name: cve_lookup
    tool: mcp:vulnerability-tools/cve_lookup
    for_each: "extract_alert_iocs.cve_ids"
    params:
      cve_id: "{{item}}"
    condition:
      if: "{{extract_alert_iocs.cve_ids}}"
    description: CVE detailed information (CVSS, description, impact)

  - name: cve_kev
    tool: mcp:vulnerability-tools/kev_check
    for_each: "extract_alert_iocs.cve_ids"
    params:
      cve_id: "{{item}}"
    condition:
      if: "{{extract_alert_iocs.cve_ids}}"
    description: Check whether the CVE is in the CISA KEV (Known Exploited Vulnerabilities) list

  - name: cve_epss
    tool: mcp:vulnerability-tools/epss_score
    for_each: "extract_alert_iocs.cve_ids"
    params:
      cve_id: "{{item}}"
    condition:
      if: "{{extract_alert_iocs.cve_ids}}"
    description: EPSS score - exploit probability estimation

  # ===== Phase 5: Prioritization =====
  - name: priority_evaluation
    condition:
      if: "hash_malwarebazaar_any_malicious == true or ip_blocklist_any_malicious == true or ip_feodo_any_malicious == true or threatfox_all_any_malicious == true or cve_kev_any_malicious == true"
      then: high_priority_response
      else: low_priority_document

  - name: high_priority_response
    action: trigger_playbook
    params:
      playbook: incident_response
      incident_description: "{{alert_text}}"
      enriched_iocs: "{{threatfox_all}}"
    description: >
      HIGH PRIORITY - Confirmed threat found.
      IOCs matched in threat intel databases.
      Redirect to incident response playbook.

  - name: low_priority_document
    action: final_answer
    description: >
      Alert triage report:
      - Extracted IOC list
      - Threat intel results (MalwareBazaar, URLhaus, ThreatFox, Feodo, blocklist)
      - OSINT information (GeoIP, WHOIS, DNS)
      - CVE/EPSS/KEV checks
      - Priority level and recommended actions
      - False positive assessment