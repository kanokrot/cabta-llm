name: IOC Triage
category: Threat Intel
description: >
  Automated triage for suspicious IOCs (IP, domain, hash, URL).
  Enrichment using multiple free threat intelligence sources.
trigger_type: manual
input_params:
  - name: ioc
    description: IOC value (IP, domain, hash, or URL)
    required: true
  - name: ioc_type
    description: IOC type hint (ip, domain, hash, url) - auto-detected if omitted
    required: false

steps:
  - name: identify_ioc_type
    tool: extract_iocs
    params:
      text: "{{ioc}}"
    description: Automatically detect IOC type

  # ===== IP Analysis =====
  - name: geoip
    tool: mcp:osint_tools/geoip_lookup
    params:
      ip: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'ip' or {{identify_ioc_type.ips}}"
    description: GeoIP location and ASN information

  - name: reverse_dns
    tool: mcp:osint_tools/reverse_dns
    params:
      ip: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'ip' or {{identify_ioc_type.ips}}"
    description: Reverse DNS resolution

  - name: feodo_check
    tool: mcp:threat_intel_tools/feodo_tracker_check
    params:
      ip: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'ip' or {{identify_ioc_type.ips}}"
    description: Feodo Tracker botnet C2 check

  - name: tor_check
    tool: mcp:threat_intel_tools/tor_exit_node_check
    params:
      ip: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'ip' or {{identify_ioc_type.ips}}"
    description: Tor exit node check

  - name: blocklist_check
    tool: mcp:threat_intel_tools/blocklist_check
    params:
      ip: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'ip' or {{identify_ioc_type.ips}}"
    description: Spamhaus, DShield, Blocklist.de check

  # ===== Domain Analysis =====
  - name: whois
    tool: mcp:osint_tools/whois_lookup
    params:
      target: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'domain'"
    description: WHOIS record information

  - name: dns_resolve
    tool: mcp:osint_tools/dns_resolve
    params:
      domain: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'domain'"
    description: DNS records

  - name: ssl_check
    tool: mcp:osint_tools/ssl_certificate_info
    params:
      host: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'domain'"
    description: SSL certificate information

  - name: subdomains
    tool: mcp:osint_tools/subdomain_enumerate
    params:
      domain: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'domain'"
    description: Discover subdomains (crt.sh)

  # ===== Free OSINT Enrichment =====
  - name: shodan_ip_check
    tool: mcp:free_osint_tools/shodan_internetdb_lookup
    params:
      ip: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'ip' or {{identify_ioc_type.ips}}"
    description: Check open ports, CVEs, and services for IP via Shodan InternetDB (FREE)

  - name: crtsh_check
    tool: mcp:free_osint_tools/crtsh_subdomain_search
    params:
      domain: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'domain'"
    description: Subdomain discovery via crt.sh Certificate Transparency

  # ===== URL Analysis =====
  - name: openphish_check
    tool: mcp:free_osint_tools/openphish_lookup
    params:
      url: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'url'"
    description: OpenPhish phishing URL feed check

  - name: urlhaus_check
    tool: mcp:threat_intel_tools/urlhaus_lookup
    params:
      indicator: "{{ioc}}"
    description: Check in URLhaus

  # ===== Hash Analysis =====
  - name: malwarebazaar_check
    tool: mcp:threat_intel_tools/malwarebazaar_hash_lookup
    params:
      hash_value: "{{ioc}}"
    condition:
      if: "{{ioc_type}} == 'hash'"
    description: Check hash in MalwareBazaar

  # ===== General =====
  - name: threatfox_check
    tool: mcp:threat_intel_tools/threatfox_ioc_lookup
    params:
      indicator: "{{ioc}}"
    description: Check IOC in ThreatFox

  - name: threat_intel_lookup
    tool: investigate_ioc
    params:
      ioc: "{{ioc}}"
    description: Internal threat intelligence check

  # ===== Verdict / Decision =====
  - name: evaluate_verdict
    condition:
      if: "{{threat_intel_lookup.threat_score}} >= 70 or {{blocklist_check.malicious}} or {{feodo_check.malicious}}"
      then: escalate
      else: document
    description: Evaluate threat level

  - name: escalate
    tool: generate_rules
    params:
      analysis_result: "{{threat_intel_lookup}}"
    description: Generate detection rules for malicious IOC

  - name: document
    action: final_answer
    description: >
      IOC triage report: GeoIP, WHOIS, DNS, threat intel results,
      blocklist status, verdict, and actions