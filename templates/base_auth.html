{# Shared public authentication shell. #}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CABTA Authentication{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
    <link rel="apple-touch-icon" href="/static/img/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/themes.css?v=5" rel="stylesheet">
    <style>
        html, body { min-height: 100%; }
        body.auth-page {
            min-height: 100vh;
            margin: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-panel { width: min(100%, 440px); }
        .auth-brand {
            color: var(--text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: .65rem;
            font-weight: 700;
            letter-spacing: .02em;
        }
        .auth-brand img { width: 42px; height: 42px; filter: drop-shadow(0 0 8px rgba(0, 212, 255, .35)); }
        .auth-panel .card { background: var(--bg-card); border-color: var(--border-color); }
        .auth-panel .form-control {
            background: var(--bg-tertiary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .auth-panel .form-control::placeholder { color: var(--text-muted); }
        .auth-panel .form-control:focus { background: var(--bg-tertiary); color: var(--text-primary); }
        .auth-panel .form-label { color: var(--text-secondary); }
        .auth-panel a { color: var(--color-primary); }
        .auth-theme-toggle { color: var(--text-secondary); border-color: var(--border-color); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a class="auth-brand" href="/login" aria-label="CABTA sign in">
                    <img src="/static/img/logo.svg" alt="CABTA">
                    <span>CABTA<small class="d-block text-muted fw-normal">Cyan Agent Blue Team Assistant</small></span>
                </a>
                <button type="button" class="btn btn-sm auth-theme-toggle theme-toggle" onclick="MCPTheme.toggle()" title="Toggle theme" aria-label="Toggle theme">◐</button>
            </div>
            {% block content %}{% endblock %}
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme.js?v=5"></script>
    <script src="/static/js/auth.js?v=1"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
