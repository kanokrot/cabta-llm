{% extends "base_auth.html" %}

{% block title %}Sign in - CABTA{% endblock %}

{% block content %}
<div class="card shadow-lg">
    <div class="card-body p-4 p-md-5">
        <div class="mb-4">
            <h1 class="h3 mb-2">Sign in</h1>
            <p class="text-muted mb-0">Access the CTI operations dashboard.</p>
        </div>

        <form id="login-form" data-auth-form="login" data-next="{{ next_path | e }}" novalidate>
            <div class="mb-3">
                <label class="form-label" for="login-identifier">Username or email</label>
                <input class="form-control" id="login-identifier" name="username" type="text"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="login-password">Password</label>
                <input class="form-control" id="login-password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <button class="btn btn-accent w-100" type="submit">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
            </button>
        </form>

        <p class="text-muted small text-center mt-4 mb-0">
            Have an invitation?
            <a href="/register">Activate your account</a>
            <br>
            Don't have one?
            <a href="/request-access">Request access</a>
        </p>
    </div>
</div>
{% endblock %}
